# Every push and pull request: code checks, the Vitest suite against a real
# Postgres and stripe-mock, then a production build tested end to end in
# Chromium (desktop and phone). Deployment is Vercel's job (docs/DEPLOYMENT.md).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Test-only values: no real secrets are needed anywhere in CI.
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-0000
  ADMIN_EMAILS: admin@example.com

jobs:
  checks:
    name: Lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Route types (PageProps, LayoutProps) are generated, not committed.
      - run: npx next typegen
      - run: npm run typecheck

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maison
          POSTGRES_PASSWORD: maison
          POSTGRES_DB: maison
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maison" --health-interval 2s --health-timeout 3s --health-retries 20
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports: ["12111:12111"]
    env:
      DATABASE_URL: postgresql://maison:maison@localhost:5432/maison
      TEST_DATABASE_URL: postgresql://maison:maison@localhost:5432/maison_test
      STRIPE_MOCK_URL: http://localhost:12111
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create the test database
        run: psql postgresql://maison:maison@localhost:5432/maison -c "create database maison_test"
      - run: npm test

  e2e:
    name: End-to-end (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: maison
          POSTGRES_PASSWORD: maison
          POSTGRES_DB: maison
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maison" --health-interval 2s --health-timeout 3s --health-retries 20
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports: ["12111:12111"]
    env:
      DATABASE_URL: postgresql://maison:maison@localhost:5432/maison
      SITE_URL: http://localhost:3100
      # A production build with the development fallbacks for email and images
      # (src/lib/env.ts). Payments use the real Stripe client, pointed at
      # stripe-mock; the tests send Stripe's signed webhooks themselves.
      LOCAL_PRODUCTION_TEST: "1"
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_API_BASE: http://localhost:12111
      STRIPE_WEBHOOK_SECRET: whsec_ci_only
      CRON_SECRET: ci-only-cron-secret
      E2E_STRIPE: "1"
      E2E_SERVER: npx next start --port 3100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e --project=desktop-chromium --project=mobile-chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
